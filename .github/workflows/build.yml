name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create --platforms android .
          flutter pub get

      - name: Generate Keystore & Build APK
        env:
          KEYSTORE_PASSWORD: android
          KEY_PASSWORD: android
          KEY_ALIAS: upload
        run: |
          # 强制确保 android/app 目录存在，防止 keytool 写入失败
          mkdir -p android/app
          
          # 验证 Android 工程是否生成成功，若失败则重试
          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            echo "Android project incomplete, recreating..."
            rm -rf android
            flutter create --platforms android .
            mkdir -p android/app
          fi
          
          # 1. 生成临时签名密钥
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload -storepass $KEYSTORE_PASSWORD -keypass $KEY_PASSWORD \
            -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=CN"
          
          # 2. 写入 key.properties (Flutter 默认模板会自动读取)
          echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=app/upload-keystore.jks" >> android/key.properties
          
          # 3. 编译 Release APK
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: id-card-merger-apk
          path: build/app/outputs/flutter-apk/app-release.apk
